dataset:
  # 新采样器使用独立目录，禁止与旧版失败/半成品数据混写。
  root: ./datasets/rabo_nut_handoff_simple_v1_topcam
  fps: 5
  chunk_size: 1000
  robot_type: linker_a7_o6_bimanual
  task: 双臂协 作依次抓取B、C、A螺母，由右手递交左手并放入目标区
  language_variants:
  - 双臂协作依次抓取B、C、A螺母，由右手递交左手并放入目标区
  - 右手按B、C、A的顺序抓取螺母，逐个交给左手完成放置
  - 完成三个螺母的双臂接力搬运，顺序为B、C、A
  - 使用右臂抓取、左臂接取并摆放B、C、A三个螺母
  - 将B、C、A螺母依次从右手交接给左手并放到指定位置
  cameras:
    # 初赛先简化为仅顶部相机；腕部相机稳定后再加回。
    top: r6ef2dc_tp_cam_303d2b1ce0
  primary_camera: top
  image_width: 480
  image_height: 270
  video_fourcc: mp4v
  readiness_timeout_s: 30.0
  # 任务开始前每路相机需连续收到的新图数量。
  camera_ready_min_frames: 5
  # 采样期间超过该时长无新帧则立即终止episode（禁止无限复用缓存）。
  camera_stall_timeout_s: 3.0
  # 墙钟10Hz，每个采样点读取所有话题的最新缓存；低频相机允许复用最近帧。
  sample_wait_timeout_s: 0.5
  ring_buffer_depth: 4
  writer_queue_size: 64
  # 这些阈值只用于sidecar质量统计，不会再删除采样点。
  max_joint_age_s: 1.0
  max_camera_skew_s: 1.0
  max_stamp_gap_s: 0.6
